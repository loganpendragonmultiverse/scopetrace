name: Release build
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.12" }
      - run: python -m pip install build
      - run: python -m build
      - name: Verify tag version and write distribution checksums
        run: |
          python - <<'PY_CHECKSUM'
          import hashlib
          import os
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          version = project["version"]
          if os.environ["GITHUB_REF_NAME"] != "v" + version:
              raise SystemExit("Release tag must match the package version")
          name = project["name"].replace("-", "_")
          expected = {f"{name}-{version}-py3-none-any.whl", f"{name}-{version}.tar.gz"}
          payloads = sorted([*Path("dist").glob("*.whl"), *Path("dist").glob("*.tar.gz")])
          if {path.name for path in payloads} != expected or len(payloads) != 2:
              raise SystemExit("Release requires exactly the expected wheel and source distribution")
          content = "".join(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n" for path in payloads)
          Path("dist/SHA256SUMS").write_text(content, encoding="utf-8")
          PY_CHECKSUM
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-artifacts
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS


